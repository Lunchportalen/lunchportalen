name: phase18-prepare-runtime
description: Resolve isolated Supabase keys and start Next.js for Phase 18 HTTP load jobs
inputs:
  start_next:
    description: Build and start Next.js on 127.0.0.1:3000
    required: false
    default: "true"
  health_path:
    description: Health check path
    required: false
    default: "/api/health"
runs:
  using: composite
  steps:
    - name: Resolve isolated keys
      shell: bash
      run: node scripts/phase18scale/resolve-cloud-target.mjs >> "$GITHUB_ENV"
    # Separate step: GITHUB_ENV from resolve is only available to later steps.
    - name: Cloud DB connectivity preflight (pooler IPv4 + TLS)
      shell: bash
      run: node scripts/phase18scale/cloud-db-connectivity-preflight.mjs
    - name: Inject synthetic non-production runtime env
      shell: bash
      run: |
        set -euo pipefail
        SHA="${APP_SHA:-${GITHUB_SHA:-phase18scale}}"
        {
          echo "RC_MODE=true"
          echo "SYSTEM_MOTOR_SECRET=phase18-loadcert-synthetic-not-production"
          echo "CRON_SECRET=phase18-loadcert-cron-synthetic"
          echo "APP_VERSION=${SHA}"
          echo "NEXT_PUBLIC_APP_VERSION=${SHA}"
          echo "VERCEL_GIT_COMMIT_SHA=${SHA}"
          echo "STRIPE_SECRET_KEY="
          echo "PHASE18_LOADCERT=1"
        } >> "$GITHUB_ENV"
    - name: Start Next runtime
      if: inputs.start_next == 'true'
      shell: bash
      env:
        SYSTEM_MOTOR_SECRET: phase18-loadcert-synthetic-not-production
        CRON_SECRET: phase18-loadcert-cron-synthetic
        APP_VERSION: ${{ env.APP_SHA }}
        NEXT_PUBLIC_APP_VERSION: ${{ env.APP_SHA }}
        VERCEL_GIT_COMMIT_SHA: ${{ env.APP_SHA }}
        RC_MODE: "true"
        PHASE18_LOADCERT: "1"
      run: |
        set -euo pipefail
        export SYSTEM_MOTOR_SECRET="${SYSTEM_MOTOR_SECRET}"
        export CRON_SECRET="${CRON_SECRET}"
        export APP_VERSION="${APP_VERSION:-$APP_SHA}"
        export NEXT_PUBLIC_APP_VERSION="${NEXT_PUBLIC_APP_VERSION:-$APP_SHA}"
        export VERCEL_GIT_COMMIT_SHA="${VERCEL_GIT_COMMIT_SHA:-$APP_SHA}"
        export RC_MODE=true
        npm run build
        npx next start -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &
        echo $! > /tmp/next.pid
        export PHASE18_BASE_URL=http://127.0.0.1:3000
        echo "PHASE18_BASE_URL=$PHASE18_BASE_URL" >> "$GITHUB_ENV"
        for i in $(seq 1 90); do
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PHASE18_BASE_URL${{ inputs.health_path }}" || true)
          if [ "$CODE" = "200" ]; then exit 0; fi
          sleep 2
        done
        tail -n 100 /tmp/next.log || true
        exit 1
