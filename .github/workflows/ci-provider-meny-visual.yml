# /leverandor/meny visual regression — live route, Linux baselines, blocking on PR
name: CI Provider Meny Visual

env:
  ONNXRUNTIME_NODE_INSTALL: skip

on:
  push:
    branches: ["main"]
    paths:
      - "app/leverandor/meny/**"
      - "components/providers/ProviderMenu*.tsx"
      - "app/styles/ds/provider-menu-editor.css"
      - "app/styles/ds/provider-admin.css"
      - "app/api/provider/menu-days/**"
      - "lib/provider-menu/**"
      - "e2e/provider-meny-visual-regression.e2e.ts"
      - "e2e/helpers/provider-meny-visual.ts"
      - "e2e/helpers/provider-meny-visual-auth.ts"
      - "e2e/helpers/visual-e2e-sanity-guard.ts"
      - "e2e/global-setup/provider-meny-visual-auth.setup.ts"
      - "e2e/fixtures/provider-meny-catalog.json"
      - "tests/e2e/visual-e2e-sanity-guard.test.ts"
      - "playwright.provider-meny.config.ts"
      - "e2e/provider-meny-visual-regression.e2e.ts-snapshots/**"
      - "scripts/e2e/retry-seed-with-backoff.sh"
      - "scripts/e2e/seed-e2e-provider-kitchen-access.mjs"
      - "scripts/ci/retry-npm-ci.sh"
      - "scripts/ci/retry-transient-network.sh"
      - ".github/workflows/ci-provider-meny-visual.yml"
      - "vercel.json"
  pull_request:
    branches: ["main"]
    paths:
      - "app/leverandor/meny/**"
      - "components/providers/ProviderMenu*.tsx"
      - "app/styles/ds/provider-menu-editor.css"
      - "app/styles/ds/provider-admin.css"
      - "app/api/provider/menu-days/**"
      - "lib/provider-menu/**"
      - "e2e/provider-meny-visual-regression.e2e.ts"
      - "e2e/helpers/provider-meny-visual.ts"
      - "e2e/helpers/provider-meny-visual-auth.ts"
      - "e2e/helpers/visual-e2e-sanity-guard.ts"
      - "e2e/global-setup/provider-meny-visual-auth.setup.ts"
      - "e2e/fixtures/provider-meny-catalog.json"
      - "tests/e2e/visual-e2e-sanity-guard.test.ts"
      - "playwright.provider-meny.config.ts"
      - "e2e/provider-meny-visual-regression.e2e.ts-snapshots/**"
      - "scripts/e2e/retry-seed-with-backoff.sh"
      - "scripts/e2e/seed-e2e-provider-kitchen-access.mjs"
      - "scripts/ci/retry-npm-ci.sh"
      - "scripts/ci/retry-transient-network.sh"
      - ".github/workflows/ci-provider-meny-visual.yml"
      - "vercel.json"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate Linux baselines (--update-snapshots). Intentional visual changes only."
        required: false
        type: boolean
        default: false
      prove_gate_bite:
        description: "Prove gate bites: deliberate lp-editor CSS delta → RED → revert → GREEN."
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-provider-meny-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-meny-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    env:
      RC_MODE: "true"
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=8192"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"
      LP_DEBUG_AUTH: "1"
      LP_E2E_EXTERNAL_SERVER: "1"
      SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: bash scripts/ci/retry-npm-ci.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Provider menu unit tests
        run: >-
          npx vitest run
          tests/app/leverandor/meny.test.tsx
          tests/components/providerMenuWeekPlanner-badges.test.tsx
          tests/lib/provider-menu/providerMenuOrderLock.test.ts
          tests/e2e/visual-e2e-sanity-guard.test.ts
          --config vitest.config.ts

      - name: Verify E2E Supabase target is uigx (not prod)
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          set -euo pipefail
          url="${NEXT_PUBLIC_SUPABASE_URL}"
          if [[ "$url" == *"hkpokyapzarefrgqzkos"* ]]; then
            echo "::error::Provider meny visual E2E must not target prod Supabase"
            exit 1
          fi
          if [[ "$url" != *"uigxsboqeruxflgzqztl"* ]]; then
            echo "::error::Provider meny visual E2E Supabase URL must target uigx"
            exit 1
          fi

      - name: Verify visual E2E Sanity dataset is not production
        shell: bash
        env:
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          set -euo pipefail
          dataset="${NEXT_PUBLIC_SANITY_DATASET:-}"
          if [[ -z "$dataset" ]]; then
            echo "::error::Provider meny visual E2E requires NEXT_PUBLIC_SANITY_DATASET"
            exit 1
          fi
          lower="$(printf '%s' "$dataset" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower" == "production" || "$lower" == "prod" ]]; then
            echo "::error::Provider meny visual E2E must not target Sanity production dataset (4udoq5d8/production)"
            exit 1
          fi
          echo "Sanity dataset OK for visual E2E: $dataset"

      - name: Build (production)
        run: npx next build

      - name: Install psql
        run: |
          apt-get update -qq
          apt-get install -y -qq postgresql-client

      - name: Bootstrap E2E env from secrets
        shell: bash
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets['E2E_TEST_USER_EMAIL'] }}
          E2E_TEST_USER_PASSWORD: ${{ secrets['E2E_TEST_USER_PASSWORD'] }}
          E2E_EMPLOYEE_EMAIL: ${{ secrets['E2E_EMPLOYEE_EMAIL'] }}
          E2E_EMPLOYEE_PASSWORD: ${{ secrets['E2E_EMPLOYEE_PASSWORD'] }}
          E2E_ADMIN_EMAIL: ${{ secrets['E2E_ADMIN_EMAIL'] }}
          E2E_ADMIN_PASSWORD: ${{ secrets['E2E_ADMIN_PASSWORD'] }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets['E2E_SUPERADMIN_EMAIL'] }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets['E2E_SUPERADMIN_PASSWORD'] }}
        run: |
          set -euo pipefail
          : "${E2E_TEST_USER_EMAIL:?Missing E2E_TEST_USER_EMAIL secret}"
          : "${E2E_TEST_USER_PASSWORD:?Missing E2E_TEST_USER_PASSWORD secret}"
          : "${E2E_EMPLOYEE_EMAIL:?Missing E2E_EMPLOYEE_EMAIL secret}"
          : "${E2E_EMPLOYEE_PASSWORD:?Missing E2E_EMPLOYEE_PASSWORD secret}"
          : "${E2E_ADMIN_EMAIL:?Missing E2E_ADMIN_EMAIL secret}"
          : "${E2E_ADMIN_PASSWORD:?Missing E2E_ADMIN_PASSWORD secret}"
          : "${E2E_SUPERADMIN_EMAIL:?Missing E2E_SUPERADMIN_EMAIL secret}"
          : "${E2E_SUPERADMIN_PASSWORD:?Missing E2E_SUPERADMIN_PASSWORD secret}"
          d=E2EENV__DELIM__LP
          for key in \
            E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD \
            E2E_EMPLOYEE_EMAIL E2E_EMPLOYEE_PASSWORD \
            E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD \
            E2E_SUPERADMIN_EMAIL E2E_SUPERADMIN_PASSWORD; do
            val="${!key:-}"
            {
              echo "${key}<<${d}"
              printf '%s\n' "$val"
              echo "${d}"
            } >> "$GITHUB_ENV"
          done

      - name: Build staging DATABASE_URL
        shell: bash
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ENCODED="$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD'], safe=''))")"
          URL="postgresql://postgres.${PROJECT_REF}:${ENCODED}@aws-0-eu-west-1.pooler.supabase.com:5432/postgres"
          echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"

      - name: Seed staging tenant + E2E users + provider kitchen access
        shell: bash
        run: bash scripts/e2e/retry-seed-with-backoff.sh

      - name: Start server
        shell: bash
        run: |
          : > server.log
          npm run start >> server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://localhost:3000/ || true)
            if [[ "$code" =~ ^[23][0-9][0-9]$ ]]; then echo "Server ready ($code)"; break; fi
            if [ "$i" -eq 60 ]; then
              echo "::group::server.log (startup failure)"
              tail -n 200 server.log || true
              echo "::endgroup::"
              echo "Server did not become ready"
              exit 1
            fi
            sleep 2
          done
        env:
          PORT: 3000
          LP_DEBUG_AUTH: "1"

      - name: Provider meny visual regression (screenshot diff)
        id: provider_meny_visual_screenshots
        shell: bash
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_snapshots }}" = "true" ]; then
            if [ "$(uname -s)" != "Linux" ]; then
              echo "::error::--update-snapshots only allowed on Linux (Playwright noble CI container)"
              exit 1
            fi
            FLAGS="--update-snapshots"
          fi
          set +e
          npx playwright test --config playwright.provider-meny.config.ts --reporter=list ${FLAGS}
          EXIT=$?
          if [ "$EXIT" -ne 0 ]; then
            echo "::group::server.log (tail 300)"
            tail -n 300 server.log 2>/dev/null || echo "server.log missing"
            echo "::endgroup::"
          fi
          exit $EXIT

      - name: Prove visual gate bites (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.prove_gate_bite == true
        shell: bash
        run: bash scripts/e2e/prove-provider-meny-visual-gate.sh

      - name: Dump full server log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::server.log (full)"
          cat server.log 2>/dev/null || echo "server.log missing"
          echo "::endgroup::"

      - name: Upload updated provider meny visual snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true
        uses: actions/upload-artifact@v6
        with:
          name: provider-meny-visual-snapshots-linux
          path: e2e/provider-meny-visual-regression.e2e.ts-snapshots/
          retention-days: 7

      - name: Upload provider meny visual report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-provider-meny-visual-report
          path: |
            playwright-provider-meny-visual-report/
            test-results/
            server.log
          retention-days: 14
