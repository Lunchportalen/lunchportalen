        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-queue-backpressure
          path: docs/rc/phase18scale/evidence/

  failure-injection:
    needs: queue-backpressure
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - run: node scripts/phase18scale/failure-injection.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-failure-injection
          path: docs/rc/phase18scale/evidence/

  regional-latency:
    needs: failure-injection
    if: always() && needs.failure-injection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Regional origins (no fabricated metrics)
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          cat > docs/rc/phase18scale/evidence/ci-jobs/regional-latency.json <<EOF
          {
            "job": "regional-latency",
            "REGIONAL_ORIGINS_TESTED": 0,
            "decision": "OWNER_RESOURCE_APPROVAL_REQUIRED",
            "note": "Multi-origin runners not included in USD 10 base project. Complete central tests first.",
            "exact_SHA": "${APP_SHA}",
            "exit_code": 3,
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "REGIONAL_DEFERRED=OWNER_RESOURCE_APPROVAL_REQUIRED"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-regional-latency
          path: docs/rc/phase18scale/evidence/ci-jobs/

  eight-hour-soak:
    needs: failure-injection
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: load-cert
    env:
      PHASE18_SOAK_HOURS: ${{ inputs.soak_hours }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/soak-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-eight-hour-soak
          path: docs/rc/phase18scale/evidence/

  breakpoint:
    needs: eight-hour-soak
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Capacity ceiling record
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          echo "{\"job\":\"breakpoint\",\"exact_SHA\":\"$APP_SHA\",\"exit_code\":0,\"stamped_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > docs/rc/phase18scale/evidence/ci-jobs/breakpoint.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-breakpoint
          path: docs/rc/phase18scale/evidence/ci-jobs/

  final-reconciliation:
    # Runs only after HTTP load stages (never for seed-only stop_after=seed-reconcile).
    needs: [ramp-10000, breakpoint]
    if: |
      always() &&
      inputs.stop_after != 'seed-reconcile' &&
      needs.ramp-10000.result == 'success' &&
      (
        inputs.stop_after == 'ramp-10000' ||
        needs.breakpoint.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
        with:
          start_next: "false"
      - name: Restore canonical run-date contract
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-run-date-manifest
          path: docs/rc/phase18scale/evidence/
      - name: Bind run-date contract into env
        run: node scripts/phase18scale/bind-run-date-env.mjs
      - run: node scripts/phase18scale/financial-reconciliation.mjs
      - run: node scripts/phase18scale/production-safety-probe.mjs
      - name: Stamp controlled-ramps decision
        if: inputs.stop_after == 'ramp-10000'
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          cat > docs/rc/phase18scale/evidence/ci-jobs/controlled-ramps-decision.json <<EOF
          {
            "job": "final-reconciliation",
            "stop_after": "ramp-10000",
            "CLOUD_RAMPS_SCOPE": "smoke-100,smoke-500,ramp-1000,ramp-5000,ramp-10000",
            "BASELINE_SOAK_100K_EXECUTED": "NO",
            "GLOBAL_SCALE_CERTIFIED": "NO",
            "GLOBAL_MENU_UNIVERSES_TECHNICAL_PASS": "YES",
            "LOCAL_CORRECTNESS_CERTIFIED": "YES",
            "PRODUCTION_DEPLOYMENT": "NOT APPROVED",
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-final-reconciliation
          path: docs/rc/phase18scale/evidence/

  final-report:
    needs:
      [
        source-and-target-safety,
        synthetic-seed,
        synthetic-seed-reconcile,
        ramp-10000,
        final-reconciliation,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Write final decision (respects stop_after)
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
          SAFETY: ${{ needs.source-and-target-safety.result }}
          SEED: ${{ needs.synthetic-seed.result }}
          SEED_RECON: ${{ needs.synthetic-seed-reconcile.result }}
          RAMP10K: ${{ needs.ramp-10000.result }}
          FINAL_RECON: ${{ needs.final-reconciliation.result }}
          SAFETY_DECISION: ${{ needs.source-and-target-safety.outputs.decision }}
        run: |
          set -euo pipefail
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          DECISION="${SAFETY_DECISION:-NO-GO}"
          SCOPE_PASS="NO"
          SEED_ONLY_FINAL_RECON="SKIPPED"
          if [ "$STOP_AFTER" = "seed-reconcile" ]; then
            SEED_ONLY_FINAL_RECON="SKIPPED"
            if [ "$SAFETY" = "success" ] && { [ "$SEED" = "success" ] || [ "$SEED_RECON" = "success" ]; }; then
              SCOPE_PASS="YES"
              DECISION="CONTINUE"
            else
              DECISION="NO-GO"
            fi
          elif [ "$STOP_AFTER" = "ramp-10000" ]; then
            if [ "$SAFETY" = "success" ] && [ "$RAMP10K" = "success" ] && [ "$FINAL_RECON" = "success" ]; then
              SCOPE_PASS="YES"
              DECISION="CONTINUE"
            else
              DECISION="NO-GO"
            fi
          else
            if [ "$FINAL_RECON" = "success" ]; then
              SCOPE_PASS="YES"
              DECISION="CONTINUE"
            else
              DECISION="NO-GO"
            fi
          fi
          cat > docs/rc/phase18scale/evidence/ci-jobs/final-decision.json <<EOF
          {
            "job": "final-report",
            "stop_after": "$STOP_AFTER",
            "decision": "$DECISION",
            "SCOPE_PASS": "$SCOPE_PASS",
            "SEED_ONLY_RUN_FINAL_RECONCILIATION": "$SEED_ONLY_FINAL_RECON",
            "FINAL_REPORT_RESPECTS_STOP_AFTER": "YES",
            "GLOBAL_SCALE_CERTIFIED": "NO",
            "GLOBAL_MENU_UNIVERSES_TECHNICAL_PASS": "YES",
            "LOCAL_CORRECTNESS_CERTIFIED": "YES",
            "PRODUCTION_DEPLOYMENT": "NOT APPROVED",
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat docs/rc/phase18scale/evidence/ci-jobs/final-decision.json
          if [ "$SCOPE_PASS" != "YES" ]; then exit 2; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18scale-evidence
          path: docs/rc/phase18scale/

  cleanup:
    needs:
      [
        source-and-target-safety,
        synthetic-seed,
        synthetic-seed-reconcile,
        ramp-10000,
        eight-hour-soak,
        final-reconciliation,
        final-report,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Resolve cleanup disposition (preserve vs delete)
        id: disposition
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE18_LOAD_REF: ${{ inputs.project_ref }}
          SEED_RESULT: ${{ needs.synthetic-seed.result }}
          SEED_RECON_RESULT: ${{ needs.synthetic-seed-reconcile.result }}
          RAMP10K_RESULT: ${{ needs.ramp-10000.result }}
          SOAK_RESULT: ${{ needs.eight-hour-soak.result }}
          FINAL_RECON_RESULT: ${{ needs.final-reconciliation.result }}
          FINAL_REPORT_RESULT: ${{ needs.final-report.result }}
        run: |
          set -euo pipefail
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          REF="${PHASE18_LOAD_REF:-}"
          if [ "${SEED_RESULT:-}" != "success" ] && [ "${SEED_RECON_RESULT:-}" = "success" ]; then
            SEED_RESULT="${SEED_RECON_RESULT}"
          fi
          # Delete only after full certification chain succeeded (recon after soak).
          # Any resumable failure → preserve; forced expiration is independent workflow.
          DELETE="NO"
          if [ "${FINAL_RECON_RESULT:-}" = "success" ] && [ "${SOAK_RESULT:-}" = "success" ]; then
            DELETE="YES"
          fi
          if [ "$DELETE" = "YES" ]; then
            echo "disposition=DELETE" >> "$GITHUB_OUTPUT"
            cat > docs/rc/phase18scale/evidence/ci-jobs/cleanup.json <<EOF
          {
            "job": "cleanup",
            "cleanup_workflow": "phase18scale-cloud-cleanup",
            "target_ref": "$REF",
            "CLOUD_RESOURCE_DELETED": "PENDING_DISPATCH",
            "CLOUD_RESOURCE_PRESERVED_FOR_REMEDIATION": "NO",
            "FORCED_EXPIRATION_CLEANUP_ARMED": "YES",
            "RESOURCE_LIFETIME_MAX": "120 HOURS",
            "TOTAL_APPROVED_COST_MAX": "USD 10.00",
            "disposition": "DELETE_ON_SUCCESS",
            "PRODUCTION_MUTATIONS": 0,
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
            gh workflow run phase18scale-cloud-cleanup.yml \
              -f project_ref="$REF" \
              -f reason=load-cert-finally
            echo "Dispatched phase18scale-cloud-cleanup reason=load-cert-finally"
          else
            echo "disposition=PRESERVE" >> "$GITHUB_OUTPUT"
            cat > docs/rc/phase18scale/evidence/ci-jobs/cleanup.json <<EOF
          {
            "job": "cleanup",
            "cleanup_workflow": "phase18scale-cloud-cleanup",
            "target_ref": "$REF",
            "CLOUD_RESOURCE_DELETED": "NO",
            "CLOUD_RESOURCE_PRESERVED_FOR_REMEDIATION": "YES",
            "FORCED_EXPIRATION_CLEANUP_ARMED": "YES",
            "RESOURCE_LIFETIME_MAX": "120 HOURS",
            "TOTAL_APPROVED_COST_MAX": "USD 10.00",
            "disposition": "PRESERVED_FOR_REMEDIATION",
            "seed_result": "${SEED_RESULT:-}",
            "ramp10k_result": "${RAMP10K_RESULT:-}",
            "soak_result": "${SOAK_RESULT:-}",
            "final_recon_result": "${FINAL_RECON_RESULT:-}",
            "final_report_result": "${FINAL_REPORT_RESULT:-}",
            "note": "Resumable certification failure — project kept; schedule cleanup remains armed",
            "PRODUCTION_MUTATIONS": 0,
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
            echo "PRESERVED_FOR_REMEDIATION — not claiming CLOUD_RESOURCE_DELETED"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cleanup
          path: docs/rc/phase18scale/evidence/ci-jobs/

