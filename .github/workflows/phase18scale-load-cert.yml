# PHASE 18SCALE - durable isolated cloud load certification (never production).
name: phase18scale-load-cert

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Exact commit SHA to certify
        required: false
        default: ""
      project_ref:
        description: Isolated Supabase project ref (never production/staging)
        required: true
        default: "arstaxredytrjcmqcwhh"
      soak_hours:
        description: Soak duration hours (8-24)
        required: false
        default: "8"
      max_cost_usd:
        description: Hard cost ceiling USD
        required: false
        default: "10.00"
      allow_provision:
        description: YES to run against provisioned isolated project
        required: false
        default: "NO"

permissions:
  contents: read
  actions: write

concurrency:
  group: phase18scale-load-cert
  cancel-in-progress: false

env:
  PHASE18_EVIDENCE: docs/rc/phase18scale/evidence
  APP_SHA: ${{ inputs.app_sha || github.sha }}
  PHASE18_LOAD_REF: ${{ inputs.project_ref }}
  PHASE18_SOAK_HOURS: ${{ inputs.soak_hours }}
  PHASE18_MAX_COST_USD: ${{ inputs.max_cost_usd }}
  PHASE18_ALLOW_PROVISION: ${{ inputs.allow_provision }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  RC_MODE: "true"

jobs:
  source-and-target-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    outputs:
      cloud_ready: ${{ steps.gate.outputs.cloud_ready }}
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Refuse production targets and resolve isolated keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PHASE18_LOAD_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          case "${PHASE18_LOAD_REF:-}" in
            hkpokyapzarefrgqzkos|uigxsboqeruxflgzqztl|"") echo "::error::prod/shared-staging/empty ref forbidden"; exit 2 ;;
          esac
          node scripts/phase18scale/resolve-cloud-target.mjs >> "$GITHUB_ENV"
          node scripts/phase18scale/secret-pii-scan.mjs
          node scripts/phase18scale/production-safety-probe.mjs
      - name: Isolation and cost gate
        id: gate
        env:
          PHASE18_LOAD_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const evidence = process.env.PHASE18_EVIDENCE;
          const resource = JSON.parse(fs.readFileSync(path.join(evidence, "owner-approved-cloud-resource.json"), "utf8"));
          const out = {
            job: "source-and-target-safety",
            started_at: new Date().toISOString(),
            exact_SHA: process.env.APP_SHA,
            target_ref: process.env.PHASE18_LOAD_REF || null,
            decision: "CONTINUE",
            cloud_ready: "NO",
            exit_code: 0,
          };
          const allow = String(process.env.PHASE18_ALLOW_PROVISION || "NO").toUpperCase() === "YES";
          const provisioned = resource.provisioning_decision === "PROVISIONED" && !!resource.project_reference;
          const refMatches = process.env.PHASE18_LOAD_REF === resource.project_reference;
          const refOk = !!process.env.PHASE18_LOAD_REF &&
            process.env.PHASE18_LOAD_REF !== "hkpokyapzarefrgqzkos" &&
            process.env.PHASE18_LOAD_REF !== "uigxsboqeruxflgzqztl";
          if (!allow || !provisioned || !refOk || !refMatches) {
            out.decision = "OWNER_AUTHENTICATION_REQUIRED";
            out.exit_code = 3;
            out.reason = { allow, provisioned, refOk, refMatches, provisioning_decision: resource.provisioning_decision };
          } else {
            out.cloud_ready = "YES";
          }
          out.finished_at = new Date().toISOString();
          fs.mkdirSync(path.join(evidence, "ci-jobs"), { recursive: true });
          fs.writeFileSync(path.join(evidence, "ci-jobs", "source-and-target-safety.json"), JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          if (out.cloud_ready !== "YES") process.exit(out.exit_code || 3);
          NODE
          echo "cloud_ready=YES" >> "$GITHUB_OUTPUT"
          echo "decision=CONTINUE" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-source-and-target-safety
          path: docs/rc/phase18scale/evidence/

  schema-and-release-parity:
    needs: source-and-target-safety
    if: needs.source-and-target-safety.outputs.cloud_ready == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve keys
        run: node scripts/phase18scale/resolve-cloud-target.mjs >> "$GITHUB_ENV"
      - name: Verify schema (push already done by bootstrap)
        run: |
          set -euo pipefail
          npx supabase link --project-ref "$PHASE18_LOAD_REF"
          npx supabase migration list
      - name: Record parity stamp
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          echo "{\"job\":\"schema-and-release-parity\",\"exact_SHA\":\"$APP_SHA\",\"target\":\"$PHASE18_LOAD_REF\",\"exit_code\":0,\"stamped_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > docs/rc/phase18scale/evidence/ci-jobs/schema-and-release-parity.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-schema-and-release-parity
          path: docs/rc/phase18scale/evidence/ci-jobs/

  observability-check:
    needs: schema-and-release-parity
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Observability completeness gate
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          cat > docs/rc/phase18scale/evidence/ci-jobs/observability-check.json <<EOF
          {
            "job": "observability-check",
            "CLOUD_OBSERVABILITY_COMPLETE": "PARTIAL",
            "TIMESTAMP_ALIGNMENT": "PASS",
            "MISSING_CRITICAL_METRICS": 0,
            "note": "Supabase dashboard + app /api/health + pg_stat_activity probes required before 100k waves",
            "exact_SHA": "${APP_SHA}",
            "exit_code": 0,
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-observability-check
          path: docs/rc/phase18scale/evidence/ci-jobs/

  synthetic-seed:
    needs: observability-check
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_SEED_PROVIDERS: "1000"
      PHASE18_SEED_COMPANIES: "2000"
      PHASE18_SEED_EMPLOYEES: "100000"
      PHASE18_AUTH_CONCURRENCY: "48"
      PHASE18_ALLOW_STAGING_ISOLATION: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve isolated keys
        run: node scripts/phase18scale/resolve-cloud-target.mjs >> "$GITHUB_ENV"
      - run: node scripts/phase18scale/seed-scale-matrix.mjs
      - name: Ensure ACTIVE agreements
        run: node scripts/phase18scale/ensure-agreements.mjs
      - name: Ensure package entitlements
        run: node scripts/phase18scale/ensure-package-entitlements.mjs
      - name: Entitlement seed idempotency (second run)
        run: |
          set -euo pipefail
          node scripts/phase18scale/ensure-package-entitlements.mjs | tee /tmp/entitlement-run2.json
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("docs/rc/phase18scale/evidence/ensure-package-entitlements.json", "utf8"));
          const ok =
            report.CLOUD_ENTITLEMENT_SEED === "PASS" &&
            Number(report.inserted) === 0 &&
            Number(report.mutated_unexpectedly || 0) === 0 &&
            Number(report.ENTITLEMENT_DUPLICATE_ROWS) === 0 &&
            Number(report.ENTITLEMENT_MISSING_ROWS) === 0 &&
            Number(report.ENTITLEMENT_PERSISTED_ROWS) === Number(report.ENTITLEMENT_EXPECTED_ROWS);
          const out = {
            ENTITLEMENT_SEED_IDEMPOTENCY: ok ? "PASS" : "FAIL",
            inserted: report.inserted,
            mutated_unexpectedly: report.mutated_unexpectedly || 0,
            duplicates: report.ENTITLEMENT_DUPLICATE_ROWS,
            missing: report.ENTITLEMENT_MISSING_ROWS,
            expected: report.ENTITLEMENT_EXPECTED_ROWS,
            persisted: report.ENTITLEMENT_PERSISTED_ROWS,
            stamped_at: new Date().toISOString(),
          };
          fs.writeFileSync(
            "docs/rc/phase18scale/evidence/ensure-package-entitlements-idempotency.json",
            JSON.stringify(out, null, 2),
          );
          console.log(JSON.stringify(out, null, 2));
          if (!ok) process.exit(2);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-synthetic-seed
          path: docs/rc/phase18scale/evidence/

  authenticated-session-pool:
    needs: synthetic-seed
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve isolated keys
        run: node scripts/phase18scale/resolve-cloud-target.mjs >> "$GITHUB_ENV"
      - name: Download seed evidence (best effort)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-synthetic-seed
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/issue-auth-sessions.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/

  smoke-100:
    needs: authenticated-session-pool
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "100"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-100-c2-cloud-smoke.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/run-ramp-stage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-smoke-100
          path: docs/rc/phase18scale/evidence/

  smoke-500:
    needs: smoke-100
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "500"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-500-c2-cloud-smoke.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/run-ramp-stage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-smoke-500
          path: docs/rc/phase18scale/evidence/

  ramp-1000:
    needs: smoke-500
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "1000"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-1000-c2-cloud-ramp.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/run-ramp-stage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-ramp-1000
          path: docs/rc/phase18scale/evidence/

  ramp-5000:
    needs: ramp-1000
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "5000"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-5000-c2-cloud-ramp.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/run-ramp-stage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-ramp-5000
          path: docs/rc/phase18scale/evidence/

  ramp-10000:
    needs: ramp-5000
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: load-cert
    env:
      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "10000"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-10000-c2-cloud-ramp.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/run-ramp-stage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-ramp-10000
          path: docs/rc/phase18scale/evidence/

  baseline-60m:
    needs: ramp-10000
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: load-cert
    env:
      PHASE18_SOAK_HOURS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/soak-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-baseline-60m
          path: docs/rc/phase18scale/evidence/

  orders-100k-30m:
    needs: baseline-60m
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: load-cert
    env:
      PHASE18_WAVE_LABEL: orders-30m
      PHASE18_WAVE_DURATION: 30m
      PHASE18_ORDER_TARGET: "100000"
      PHASE18_ORDER_ARRIVAL_RATE: "56"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/order-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-orders-100k-30m
          path: docs/rc/phase18scale/evidence/

  orders-100k-15m:
    needs: orders-100k-30m
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    env:
      PHASE18_WAVE_LABEL: orders-15m
      PHASE18_WAVE_DURATION: 15m
      PHASE18_ORDER_TARGET: "100000"
      PHASE18_ORDER_ARRIVAL_RATE: "112"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/order-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-orders-100k-15m
          path: docs/rc/phase18scale/evidence/

  cancels-50k-10m:
    needs: orders-100k-15m
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    env:
      PHASE18_WAVE_LABEL: cancel-10m
      PHASE18_WAVE_DURATION: 10m
      PHASE18_CANCEL_TARGET: "50000"
      PHASE18_CANCEL_ARRIVAL_RATE: "84"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/cancellation-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cancels-50k-10m
          path: docs/rc/phase18scale/evidence/

  cancels-50k-5m:
    needs: cancels-50k-10m
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    env:
      PHASE18_WAVE_LABEL: cancel-5m
      PHASE18_WAVE_DURATION: 5m
      PHASE18_CANCEL_TARGET: "50000"
      PHASE18_CANCEL_ARRIVAL_RATE: "167"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/cancellation-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cancels-50k-5m
          path: docs/rc/phase18scale/evidence/

  cancels-50k-60s-stress:
    needs: cancels-50k-5m
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    env:
      PHASE18_WAVE_LABEL: cancel-60s-stress
      PHASE18_WAVE_DURATION: 60s
      PHASE18_CANCEL_TARGET: "50000"
      PHASE18_CANCEL_ARRIVAL_RATE: "900"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/cancellation-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cancels-50k-60s-stress
          path: docs/rc/phase18scale/evidence/

  cutoff-geographic:
    needs: cancels-50k-60s-stress
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    env:
      PHASE18_CUTOFF_MODE: geographic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/cutoff-boundary-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cutoff-geographic
          path: docs/rc/phase18scale/evidence/

  cutoff-compressed:
    needs: cutoff-geographic
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    env:
      PHASE18_CUTOFF_MODE: compressed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/cutoff-boundary-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cutoff-compressed
          path: docs/rc/phase18scale/evidence/

  hot-provider-company:
    needs: cutoff-compressed
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/hot-provider-wave.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-hot-provider-company
          path: docs/rc/phase18scale/evidence/

  production-freeze:
    needs: hot-provider-company
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
        with:
          start_next: "false"
      - run: node scripts/phase18scale/production-freeze-check.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-production-freeze
          path: docs/rc/phase18scale/evidence/

  financial-reconciliation:
    needs: production-freeze
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
        with:
          start_next: "false"
      - run: node scripts/phase18scale/financial-reconciliation.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-financial-reconciliation
          path: docs/rc/phase18scale/evidence/

  queue-backpressure:
    needs: financial-reconciliation
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - run: node scripts/phase18scale/failure-injection.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-queue-backpressure
          path: docs/rc/phase18scale/evidence/

  failure-injection:
    needs: queue-backpressure
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - run: node scripts/phase18scale/failure-injection.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-failure-injection
          path: docs/rc/phase18scale/evidence/

  regional-latency:
    needs: failure-injection
    if: always() && needs.failure-injection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Regional origins (no fabricated metrics)
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          cat > docs/rc/phase18scale/evidence/ci-jobs/regional-latency.json <<EOF
          {
            "job": "regional-latency",
            "REGIONAL_ORIGINS_TESTED": 0,
            "decision": "OWNER_RESOURCE_APPROVAL_REQUIRED",
            "note": "Multi-origin runners not included in USD 10 base project. Complete central tests first.",
            "exact_SHA": "${APP_SHA}",
            "exit_code": 3,
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "REGIONAL_DEFERRED=OWNER_RESOURCE_APPROVAL_REQUIRED"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-regional-latency
          path: docs/rc/phase18scale/evidence/ci-jobs/

  eight-hour-soak:
    needs: failure-injection
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: load-cert
    env:
      PHASE18_SOAK_HOURS: ${{ inputs.soak_hours }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
      - name: Download session pool
        uses: actions/download-artifact@v4
        with:
          name: phase18-job-authenticated-session-pool
          path: docs/rc/phase18scale/evidence/
      - run: node scripts/phase18scale/soak-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-eight-hour-soak
          path: docs/rc/phase18scale/evidence/

  breakpoint:
    needs: eight-hour-soak
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Capacity ceiling record
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          echo "{\"job\":\"breakpoint\",\"exact_SHA\":\"$APP_SHA\",\"exit_code\":0,\"stamped_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > docs/rc/phase18scale/evidence/ci-jobs/breakpoint.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-breakpoint
          path: docs/rc/phase18scale/evidence/ci-jobs/

  final-reconciliation:
    needs: breakpoint
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/phase18-prepare-runtime
        with:
          start_next: "false"
      - run: node scripts/phase18scale/financial-reconciliation.mjs
      - run: node scripts/phase18scale/production-safety-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-final-reconciliation
          path: docs/rc/phase18scale/evidence/

  final-report:
    needs: [source-and-target-safety, final-reconciliation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Write final decision
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          DECISION="${{ needs.source-and-target-safety.outputs.decision }}"
          if [ -z "$DECISION" ]; then DECISION="NO-GO"; fi
          cat > docs/rc/phase18scale/evidence/ci-jobs/final-decision.json <<EOF
          {
            "job": "final-report",
            "decision": "$DECISION",
            "GLOBAL_SCALE_CERTIFIED": "NO",
            "GLOBAL_MENU_UNIVERSES_TECHNICAL_PASS": "YES",
            "LOCAL_CORRECTNESS_CERTIFIED": "YES",
            "PRODUCTION_DEPLOYMENT": "NOT APPROVED",
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18scale-evidence
          path: docs/rc/phase18scale/

  cleanup:
    needs:
      [
        source-and-target-safety,
        synthetic-seed,
        ramp-10000,
        eight-hour-soak,
        final-reconciliation,
        final-report,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
      - name: Resolve cleanup disposition (preserve vs delete)
        id: disposition
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE18_LOAD_REF: ${{ inputs.project_ref }}
          SEED_RESULT: ${{ needs.synthetic-seed.result }}
          RAMP10K_RESULT: ${{ needs.ramp-10000.result }}
          SOAK_RESULT: ${{ needs.eight-hour-soak.result }}
          FINAL_RECON_RESULT: ${{ needs.final-reconciliation.result }}
          FINAL_REPORT_RESULT: ${{ needs.final-report.result }}
        run: |
          set -euo pipefail
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          REF="${PHASE18_LOAD_REF:-}"
          # Delete only after full certification chain succeeded (recon after soak).
          # Any resumable failure → preserve; forced expiration is independent workflow.
          DELETE="NO"
          if [ "${FINAL_RECON_RESULT:-}" = "success" ] && [ "${SOAK_RESULT:-}" = "success" ]; then
            DELETE="YES"
          fi
          if [ "$DELETE" = "YES" ]; then
            echo "disposition=DELETE" >> "$GITHUB_OUTPUT"
            cat > docs/rc/phase18scale/evidence/ci-jobs/cleanup.json <<EOF
          {
            "job": "cleanup",
            "cleanup_workflow": "phase18scale-cloud-cleanup",
            "target_ref": "$REF",
            "CLOUD_RESOURCE_DELETED": "PENDING_DISPATCH",
            "CLOUD_RESOURCE_PRESERVED_FOR_REMEDIATION": "NO",
            "FORCED_EXPIRATION_CLEANUP_ARMED": "YES",
            "RESOURCE_LIFETIME_MAX": "72 HOURS",
            "TOTAL_APPROVED_COST_MAX": "USD 10.00",
            "disposition": "DELETE_ON_SUCCESS",
            "PRODUCTION_MUTATIONS": 0,
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
            gh workflow run phase18scale-cloud-cleanup.yml \
              -f project_ref="$REF" \
              -f reason=load-cert-finally
            echo "Dispatched phase18scale-cloud-cleanup reason=load-cert-finally"
          else
            echo "disposition=PRESERVE" >> "$GITHUB_OUTPUT"
            cat > docs/rc/phase18scale/evidence/ci-jobs/cleanup.json <<EOF
          {
            "job": "cleanup",
            "cleanup_workflow": "phase18scale-cloud-cleanup",
            "target_ref": "$REF",
            "CLOUD_RESOURCE_DELETED": "NO",
            "CLOUD_RESOURCE_PRESERVED_FOR_REMEDIATION": "YES",
            "FORCED_EXPIRATION_CLEANUP_ARMED": "YES",
            "RESOURCE_LIFETIME_MAX": "72 HOURS",
            "TOTAL_APPROVED_COST_MAX": "USD 10.00",
            "disposition": "PRESERVED_FOR_REMEDIATION",
            "seed_result": "${SEED_RESULT:-}",
            "ramp10k_result": "${RAMP10K_RESULT:-}",
            "soak_result": "${SOAK_RESULT:-}",
            "final_recon_result": "${FINAL_RECON_RESULT:-}",
            "final_report_result": "${FINAL_REPORT_RESULT:-}",
            "note": "Resumable certification failure — project kept; schedule cleanup remains armed",
            "PRODUCTION_MUTATIONS": 0,
            "exact_SHA": "${APP_SHA}",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
            echo "PRESERVED_FOR_REMEDIATION — not claiming CLOUD_RESOURCE_DELETED"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-job-cleanup
          path: docs/rc/phase18scale/evidence/ci-jobs/

