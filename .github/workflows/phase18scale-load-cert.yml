      PHASE18_LOAD_REF: ${{ inputs.project_ref }}
      PHASE18_HTTP_WAVE: "100"
      PHASE18_HTTP_CONCURRENCY: "2"
      PHASE18_HTTP_WAVE_OUT: "http-wave-100-c2-cloud-smoke.json"
