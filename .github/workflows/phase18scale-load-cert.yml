        run: node scripts/phase18scale/ensure-menu-path-price-alignment.mjs
      - name: Session menu-path preflight (100 ops)
        env:
          PHASE18_MENU_PATH_MODE: sessions
          PHASE18_HTTP_WAVE: "100"
          PHASE18_ALLOW_SESSION_WRAP: "0"
        run: node scripts/phase18scale/audit-menu-path-preflight.mjs
