          PHASE18_ALLOW_SESSION_WRAP: "0"
        run: |
          set -euo pipefail
          test -f docs/rc/phase18scale/evidence/sessions-smoke-100.ndjson
          cp docs/rc/phase18scale/evidence/sessions-smoke-100.ndjson docs/rc/phase18scale/evidence/sessions.ndjson
