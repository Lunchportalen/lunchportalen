name: phase16no3-set-cron-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set_cron:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert CRON_SECRET on recovery Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_16NO }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::${VERCEL_TOKEN}"
          echo "::add-mask::${CRON_SECRET}"
          test -n "$CRON_SECRET"
          python3 <<'PY'
          import json, os, urllib.request
          token=os.environ["VERCEL_TOKEN"]; team=os.environ["VERCEL_ORG_ID"]; project=os.environ["VERCEL_PROJECT_ID"]
          base=f"https://api.vercel.com/v10/projects/{project}/env?teamId={team}"
          existing=json.load(urllib.request.urlopen(urllib.request.Request(base, headers={"Authorization": f"Bearer {token}"})))
          envs=existing.get("envs") if isinstance(existing, dict) else existing
          for e in envs or []:
            if e.get("key")=="CRON_SECRET":
              del_url=f"https://api.vercel.com/v9/projects/{project}/env/{e['id']}?teamId={team}"
              urllib.request.urlopen(urllib.request.Request(del_url, method="DELETE", headers={"Authorization": f"Bearer {token}"}))
          body=json.dumps({"key":"CRON_SECRET","value":os.environ["CRON_SECRET"],"type":"encrypted","target":["production","preview"]}).encode()
          resp=urllib.request.urlopen(urllib.request.Request(base, data=body, method="POST", headers={"Authorization": f"Bearer {token}", "Content-Type":"application/json"}))
          print("upserted CRON_SECRET http=", resp.status, "len=", len(os.environ["CRON_SECRET"]))
          PY
