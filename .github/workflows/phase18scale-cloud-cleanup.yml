# PHASE 18SCALE — forced cleanup of isolated non-production Supabase project.
# Independent of load-cert remaining running. Never touches production.
# Deletes only on: schedule expiration, or explicit delete reasons.
name: phase18scale-cloud-cleanup

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Isolated Phase 18 project ref to delete (never production)
        required: true
      reason:
        description: cleanup reason
        required: false
        default: "manual"
  repository_dispatch:
    types: [phase18scale-cleanup]
  schedule:
    # Safety net every 6h — deletes only if evidence marks expiration passed
    - cron: "0 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: phase18scale-cloud-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: load-cert
    steps:
      - uses: actions/checkout@v4

      - name: Load owner-approved resource contract (release tip)
        run: |
          set -euo pipefail
          mkdir -p docs/rc/phase18scale/evidence
          # Schedule runs from main, which historically lacks the evidence file.
          # Always prefer the Phase 18 release-branch contract so forced expiration stays armed.
          git fetch --depth=1 origin release/global-menu-universes-21
          if git cat-file -e "FETCH_HEAD:docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json" 2>/dev/null; then
            git show "FETCH_HEAD:docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json" \
              > docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json
            echo "Loaded owner-approved contract from release/global-menu-universes-21"
          elif [ -f docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json ]; then
            echo "Using checkout-local owner-approved contract"
          else
            echo "No owner-approved contract available yet"
          fi

      - name: Refuse production refs and require explicit delete intent
        env:
          INPUT_REF: ${{ inputs.project_ref || github.event.client_payload.project_ref }}
          INPUT_REASON: ${{ inputs.reason || github.event.client_payload.reason || '' }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          REASON="${INPUT_REASON:-}"
          if [ -z "$REF" ] && [ -f docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json ]; then
            REF=$(node -e "const j=require('./docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json'); console.log(j.project_reference||'')")
          fi
          echo "TARGET_REF=$REF" >> "$GITHUB_ENV"
          echo "REASON=$REASON" >> "$GITHUB_ENV"
          case "$REF" in
            "" ) echo "No project ref — nothing to delete"; echo "SKIP=1" >> "$GITHUB_ENV" ;;
            hkpokyapzarefrgqzkos) echo "::error::production ref forbidden"; exit 2 ;;
            uigxsboqeruxflgzqztl) echo "::error::shared staging ref forbidden for this cleanup path"; exit 2 ;;
            *) echo "SKIP=0" >> "$GITHUB_ENV" ;;
          esac
          # workflow_dispatch must opt in — never delete on arm/verify/test/preserve reasons
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$REASON" in
              delete|force-expire|load-cert-finally|expired) echo "delete_intent=YES" ;;
              *) echo "Non-delete reason '$REASON' — skip deletion"; echo "SKIP=1" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Expiration gate (schedule)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const p = "docs/rc/phase18scale/evidence/owner-approved-cloud-resource.json";
          if (!fs.existsSync(p)) { console.log("no resource file"); process.exit(0); }
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          if (!j.expiration_timestamp || !j.project_reference) {
            console.log("not armed");
            fs.appendFileSync(process.env.GITHUB_ENV, "SKIP=1\n");
            process.exit(0);
          }
          if (Date.now() < Date.parse(j.expiration_timestamp)) {
            console.log("not expired yet", j.expiration_timestamp);
            fs.appendFileSync(process.env.GITHUB_ENV, "SKIP=1\n");
            process.exit(0);
          }
          console.log("expired — proceed delete", j.project_reference);
          NODE

      - name: Delete isolated project via Management API
        id: delete
        if: env.SKIP == '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing — cannot auto-delete; owner must delete manually"
            exit 2
          fi
          CODE=$(curl -sS -o /tmp/del.json -w "%{http_code}" \
            -X DELETE "https://api.supabase.com/v1/projects/${TARGET_REF}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          echo "delete_http=$CODE"
          cat /tmp/del.json || true
          echo "DELETE_HTTP=$CODE" >> "$GITHUB_ENV"
          case "$CODE" in
            200|204|404) echo "delete_ok_or_absent" ;;
            *) echo "::error::delete failed"; exit 2 ;;
          esac

      - name: Verify deletion through Supabase Management API
        id: verify
        if: env.SKIP == '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/get.json -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/${TARGET_REF}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          echo "verify_http=$CODE"
          cat /tmp/get.json || true
          echo "VERIFY_HTTP=$CODE" >> "$GITHUB_ENV"
          DELETED="NO"
          BILLING_STOPPED="UNKNOWN"
          case "$CODE" in
            404)
              DELETED="YES"
              BILLING_STOPPED="YES"
              ;;
            200)
              STATUS=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/get.json','utf8')); console.log(j.status||j.lifecycle||'')}catch{console.log('')}")
              if echo "$STATUS" | grep -qiE 'inactive|removed|gone|deleted'; then
                DELETED="YES"
                BILLING_STOPPED="YES"
              else
                echo "::error::project still present after delete attempt status=$STATUS"
                exit 2
              fi
              ;;
            *)
              echo "::error::unexpected verify status $CODE"
              exit 2
              ;;
          esac
          echo "CLOUD_RESOURCE_DELETED=$DELETED" >> "$GITHUB_ENV"
          echo "BILLING_STOPPED=$BILLING_STOPPED" >> "$GITHUB_ENV"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"

      - name: Write cleanup evidence
        if: always()
        run: |
          mkdir -p docs/rc/phase18scale/evidence/ci-jobs
          DELETED="${CLOUD_RESOURCE_DELETED:-NO}"
          if [ "${SKIP:-1}" = "1" ]; then
            DELETED="NO"
          fi
          cat > docs/rc/phase18scale/evidence/ci-jobs/cloud-cleanup.json <<EOF
          {
            "job": "cleanup",
            "workflow": "phase18scale-cloud-cleanup",
            "target_ref": "${TARGET_REF:-}",
            "event": "${{ github.event_name }}",
            "reason": "${REASON:-scheduled_or_dispatch}",
            "skipped": "${SKIP:-}",
            "delete_http": "${DELETE_HTTP:-}",
            "verify_http": "${VERIFY_HTTP:-}",
            "CLOUD_RESOURCE_DELETED": "$DELETED",
            "BILLING_STOPPED": "${BILLING_STOPPED:-UNKNOWN}",
            "FORCED_EXPIRATION_CLEANUP_ARMED": "YES",
            "RESOURCE_LIFETIME_MAX": "120 HOURS",
            "TOTAL_APPROVED_COST_MAX": "USD 10.00",
            "PRODUCTION_MUTATIONS": 0,
            "deletion_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stamped_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat docs/rc/phase18scale/evidence/ci-jobs/cloud-cleanup.json

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-cloud-cleanup
          path: docs/rc/phase18scale/evidence/ci-jobs/
