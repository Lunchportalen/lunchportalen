# Phase 16NO.3 — deploy exact production SHA to isolated Vercel project
# (lunchportalen-16no) against recovery Supabase only. Never production alias.
name: phase16no3-recovery-deploy

on:
  workflow_dispatch:
    inputs:
      recovery_project_ref:
        required: true
        default: "msecmoqfncvxrucnlpmm"
      app_sha:
        required: true
        default: "38b18c38742e1b50eb727f6bf807e1a1499f69fb"

permissions:
  contents: read

jobs:
  deploy_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Hard refuse prod/staging
        env:
          REF: ${{ inputs.recovery_project_ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            hkpokyapzarefrgqzkos|uigxsboqeruxflgzqztl) echo "::error::refused"; exit 1 ;;
          esac
          test "$REF" = "msecmoqfncvxrucnlpmm"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_sha }}

      - name: Fetch recovery API keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ inputs.recovery_project_ref }}
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          CODE=$(curl -sS -o /tmp/keys.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${REF}/api-keys")
          echo "http_status=${CODE}"
          test "$CODE" = "200"
          python3 <<'PY'
          import json, os
          keys = json.load(open("/tmp/keys.json", encoding="utf-8"))
          if isinstance(keys, dict):
              keys = keys.get("api_keys") or keys.get("keys") or []
          anon = service = ""
          for k in keys:
              name = (k.get("name") or "").lower()
              val = k.get("api_key") or ""
              if name == "anon":
                  anon = val
              if name == "service_role":
                  service = val
          if not anon or not service:
              raise SystemExit(f"missing keys names={[k.get('name') for k in keys]}")
          print(f"anon_len={len(anon)} service_len={len(service)}")
          print(f"::add-mask::{anon}")
          print(f"::add-mask::{service}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"RECOVERY_ANON={anon}\n")
              fh.write(f"RECOVERY_SERVICE={service}\n")
              fh.write(f"RECOVERY_URL=https://{os.environ['REF']}.supabase.co\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm ci + build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RECOVERY_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.RECOVERY_ANON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RECOVERY_SERVICE }}
          APP_VERSION: ${{ inputs.app_sha }}
          RECOVERY_REHEARSAL: "true"
          LP_RESEND_LIVE_SEND: "false"
          LUNCHPORTALEN_MVA_REGISTERED: "false"
          PLATFORM_INVOICE_VAT_25_ENABLED: "false"
          COUNTRY_NO_PRODUCTION_ENABLED: "true"
          COUNTRY_NO_ORDERING_ENABLED: "true"
          COUNTRY_NO_REGISTRATION_ENABLED: "true"
          COUNTRY_NO_INVOICE_ONLY_ENABLED: "true"
          COUNTRY_NO_PLATFORM_COMMISSION_ENABLED: "true"
          SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
          NEXT_PUBLIC_APP_URL: "https://lunchportalen-16no.vercel.app"
          PUBLIC_APP_URL: "https://lunchportalen-16no.vercel.app"
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upsert recovery env on isolated Vercel project + deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_16NO }}
          APP_SHA: ${{ inputs.app_sha }}
          SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID_16NO"
            exit 2
          fi
          echo "::add-mask::${VERCEL_TOKEN}"

          upsert() {
            local KEY="$1" VAL="$2" TARGET="$3"
            npx vercel env rm "$KEY" "$TARGET" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$VAL" | npx vercel env add "$KEY" "$TARGET" --token "$VERCEL_TOKEN" >/dev/null
            echo "upserted ${KEY} -> ${TARGET}"
          }

          for TARGET in preview production; do
            upsert NEXT_PUBLIC_SUPABASE_URL "$RECOVERY_URL" "$TARGET"
            upsert NEXT_PUBLIC_SUPABASE_ANON_KEY "$RECOVERY_ANON" "$TARGET"
            upsert SUPABASE_SERVICE_ROLE_KEY "$RECOVERY_SERVICE" "$TARGET"
            upsert APP_VERSION "$APP_SHA" "$TARGET"
            upsert RECOVERY_REHEARSAL "true" "$TARGET"
            upsert LP_RESEND_LIVE_SEND "false" "$TARGET"
            upsert LUNCHPORTALEN_MVA_REGISTERED "false" "$TARGET"
            upsert PLATFORM_INVOICE_VAT_25_ENABLED "false" "$TARGET"
            upsert COUNTRY_NO_PRODUCTION_ENABLED "true" "$TARGET"
            upsert COUNTRY_NO_ORDERING_ENABLED "true" "$TARGET"
            upsert COUNTRY_NO_REGISTRATION_ENABLED "true" "$TARGET"
            upsert COUNTRY_NO_INVOICE_ONLY_ENABLED "true" "$TARGET"
            upsert COUNTRY_NO_PLATFORM_COMMISSION_ENABLED "true" "$TARGET"
            upsert SYSTEM_MOTOR_SECRET "$SYSTEM_MOTOR_SECRET" "$TARGET"
            upsert NEXT_PUBLIC_APP_URL "https://lunchportalen-16no.vercel.app" "$TARGET"
            upsert PUBLIC_APP_URL "https://lunchportalen-16no.vercel.app" "$TARGET"
          done

          URL=$(npx vercel deploy --yes --token "$VERCEL_TOKEN" | tee /tmp/vercel-deploy.txt | tail -n 1)
          echo "deployment_url=${URL}"
          echo "DEPLOY_URL=${URL}" >> "$GITHUB_ENV"
          {
            echo "### Recovery deployment"
            echo "- URL: ${URL}"
            echo "- SHA: ${APP_SHA}"
            echo "- Supabase: ${{ inputs.recovery_project_ref }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        run: |
          set -euo pipefail
          sleep 8
          CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" "${DEPLOY_URL}/api/health" || true)
          echo "health_http=${CODE}"
          python3 -c 'import json; h=json.load(open("/tmp/health.json",encoding="utf-8")); print("ok=",h.get("ok"),"version=",h.get("version"))'
          test "$CODE" = "200"
