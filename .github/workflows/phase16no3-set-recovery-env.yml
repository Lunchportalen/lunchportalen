# Temporary: set recovery env correctly then exit. Merge not required if run from main after patch.
name: phase16no3-set-recovery-env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set_env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch keys + upsert via Vercel API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_16NO }}
          SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
          REF: msecmoqfncvxrucnlpmm
          APP_SHA: 38b18c38742e1b50eb727f6bf807e1a1499f69fb
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${VERCEL_TOKEN}"
          echo "::add-mask::${SYSTEM_MOTOR_SECRET}"

          CODE=$(curl -sS -o /tmp/keys.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${REF}/api-keys")
          test "$CODE" = "200"
          python3 <<'PY'
          import json, os, urllib.request
          keys = json.load(open("/tmp/keys.json", encoding="utf-8"))
          if isinstance(keys, dict):
              keys = keys.get("api_keys") or keys.get("keys") or []
          anon = service = ""
          for k in keys:
              name = (k.get("name") or "").lower()
              val = k.get("api_key") or ""
              if name == "anon":
                  anon = val
              if name == "service_role":
                  service = val
          assert anon and service, [k.get("name") for k in keys]
          print(f"anon_len={len(anon)} service_len={len(service)}")
          print(f"::add-mask::{anon}")
          print(f"::add-mask::{service}")

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_ORG_ID"]
          project = os.environ["VERCEL_PROJECT_ID"]
          base = f"https://api.vercel.com/v10/projects/{project}/env?teamId={team}"

          pairs = {
              "NEXT_PUBLIC_SUPABASE_URL": f"https://{os.environ['REF']}.supabase.co",
              "NEXT_PUBLIC_SUPABASE_ANON_KEY": anon,
              "SUPABASE_SERVICE_ROLE_KEY": service,
              "APP_VERSION": os.environ["APP_SHA"],
              "RECOVERY_REHEARSAL": "true",
              "LP_RESEND_LIVE_SEND": "false",
              "LUNCHPORTALEN_MVA_REGISTERED": "false",
              "PLATFORM_INVOICE_VAT_25_ENABLED": "false",
              "COUNTRY_NO_PRODUCTION_ENABLED": "true",
              "COUNTRY_NO_ORDERING_ENABLED": "true",
              "COUNTRY_NO_REGISTRATION_ENABLED": "true",
              "COUNTRY_NO_INVOICE_ONLY_ENABLED": "true",
              "COUNTRY_NO_PLATFORM_COMMISSION_ENABLED": "true",
              "SYSTEM_MOTOR_SECRET": os.environ["SYSTEM_MOTOR_SECRET"],
              "NEXT_PUBLIC_APP_URL": "https://lunchportalen-16no.vercel.app",
              "PUBLIC_APP_URL": "https://lunchportalen-16no.vercel.app",
          }

          # list existing
          req = urllib.request.Request(base, headers={"Authorization": f"Bearer {token}"})
          existing = json.load(urllib.request.urlopen(req))
          envs = existing.get("envs") if isinstance(existing, dict) else existing
          by_key = {}
          for e in envs or []:
              by_key.setdefault(e["key"], []).append(e)

          for key, val in pairs.items():
              for e in by_key.get(key, []):
                  del_url = f"https://api.vercel.com/v9/projects/{project}/env/{e['id']}?teamId={team}"
                  dreq = urllib.request.Request(del_url, method="DELETE", headers={"Authorization": f"Bearer {token}"})
                  try:
                      urllib.request.urlopen(dreq).read()
                  except Exception as ex:
                      print("delete_warn", key, type(ex).__name__)
              body = json.dumps({
                  "key": key,
                  "value": val,
                  "type": "encrypted",
                  "target": ["production", "preview"],
              }).encode()
              creq = urllib.request.Request(
                  base,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              resp = urllib.request.urlopen(creq)
              print(f"upserted {key} len={len(val)} http={resp.status}")

          # verify non-empty via pull metadata: re-list and ensure decrypted not available but keys exist
          existing2 = json.load(urllib.request.urlopen(urllib.request.Request(base, headers={"Authorization": f"Bearer {token}"})))
          envs2 = existing2.get("envs") if isinstance(existing2, dict) else existing2
          present = sorted({e["key"] for e in envs2 or []})
          print("present_count", len(present))
          missing = [k for k in pairs if k not in present]
          if missing:
              raise SystemExit(f"missing_after_upsert:{missing}")
          print("ENV_UPSERT_OK")
          PY
