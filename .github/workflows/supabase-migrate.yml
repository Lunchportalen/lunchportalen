name: Supabase Migrate + Verify + Evidence + Typegen

on:
  pull_request:
    branches: [ "**" ]
    paths: &supabase_ci_paths
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "studio/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "e2e/**"
      - "middleware.ts"
      - "next.config.ts"
      - "instrumentation.ts"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - ".eslintrc.cjs"
      - "eslint.config.*"
      - "AGENTS.md"
      - ".github/workflows/supabase-migrate.yml"
      - "scripts/ci/migration-gate.mjs"
      - "scripts/ci/db-contracts.mjs"
      - "scripts/smoke/cron-smoke.sh"
  push:
    branches: [ "main" ]
    paths: *supabase_ci_paths
  workflow_dispatch: {}

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE_URL: ${{ secrets.POSTDEPLOY_BASE_URL }}
      SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
      EVIDENCE_DIR: evidence/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.102.0

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Prepare evidence dir
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "ref=${GITHUB_REF}" > "$EVIDENCE_DIR/meta.txt"
          echo "sha=${GITHUB_SHA}" >> "$EVIDENCE_DIR/meta.txt"

      - name: Verify required secrets present (staging)
        run: |
          set -euo pipefail
          missing=()
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF DB_PASSWORD CRON_SECRET BASE_URL SYSTEM_MOTOR_SECRET; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required staging secrets/env: ${missing[*]}"
            exit 1
          fi
          echo "All required staging secrets present."

      - name: Build staging DATABASE_URL (session pooler)
        run: |
          set -euo pipefail
          if [ "${PROJECT_REF}" != "uigxsboqeruxflgzqztl" ]; then
            echo "::error::Refusing staging job: PROJECT_REF=${PROJECT_REF}"
            exit 1
          fi
          ENCODED="$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD'], safe=''))")"
          URL="postgresql://postgres.${PROJECT_REF}:${ENCODED}@aws-0-eu-west-1.pooler.supabase.com:5432/postgres"
          echo "STAGING_DATABASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "Staging session pooler URL configured."

      # ✅ Gate 1: Migrasjonsrekkefølge + bootstrap-sjekk (før vi toucher staging)
      - name: Migration gate (order + bootstrap-safe)
        run: |
          set -euo pipefail
          node scripts/ci/migration-gate.mjs | tee "$EVIDENCE_DIR/migration-gate.log"

      # ✅ Apply migrations to staging (session pooler db-url)
      - name: Apply migrations (staging, session pooler)
        run: |
          set -euo pipefail
          npx supabase@beta db push --db-url "$STAGING_DATABASE_URL" --yes \
            2>&1 | tee "$EVIDENCE_DIR/db-push.log"

      - name: Verify migration actually applied (staging)
        run: |
          set -euo pipefail
          LATEST_LOCAL="$(ls supabase/migrations/ | sort | tail -1 | grep -oP '^\d+' || true)"
          if [ -z "$LATEST_LOCAL" ]; then
            echo "No local migrations found — skipping verify."
            exit 0
          fi
          echo "Verifying $LATEST_LOCAL is in schema_migrations (staging)..."
          APPLIED="$(psql "$DATABASE_URL" -t -A -c \
            "SELECT version FROM supabase_migrations.schema_migrations \
             WHERE version = '$LATEST_LOCAL'")"
          if [ "$APPLIED" != "$LATEST_LOCAL" ]; then
            echo "::error::Migration $LATEST_LOCAL not in staging schema_migrations!"
            echo "Last 5 applied versions:"
            psql "$DATABASE_URL" -c \
              "SELECT version FROM supabase_migrations.schema_migrations \
               ORDER BY version DESC LIMIT 5"
            exit 1
          fi
          echo "Migration $LATEST_LOCAL verified applied on staging."

      # ✅ Verify DB contracts (fail-closed)
      - name: Verify DB contracts (staging)
        run: |
          set -euo pipefail
          node scripts/ci/db-contracts.mjs 2>&1 | tee "$EVIDENCE_DIR/db-contracts.log"

      # ✅ Optional: run your smoke scripts (cron/auth/RPC etc.)
      - name: Smoke tests (staging)
        run: |
          set -euo pipefail
          bash scripts/smoke/cron-smoke.sh 2>&1 | tee "$EVIDENCE_DIR/cron-smoke.log"

      # ✅ Typegen (committed types are optional; here we just generate + upload as evidence)
      - name: Typegen (staging)
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/typegen"
          supabase gen types typescript --project-id "$PROJECT_REF" --schema public > "$EVIDENCE_DIR/typegen/supabase.types.ts"
          echo "typegen=ok" >> "$EVIDENCE_DIR/meta.txt"

      - name: Upload evidence artifact (staging)
        uses: actions/upload-artifact@v6
        with:
          name: evidence-staging-${{ github.sha }}
          path: evidence/staging
          if-no-files-found: error

  prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE_URL: ${{ secrets.POSTDEPLOY_BASE_URL }}
      SYSTEM_MOTOR_SECRET: ${{ secrets.SYSTEM_MOTOR_SECRET }}
      EVIDENCE_DIR: evidence/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.102.0

      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Prepare evidence dir
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "ref=${GITHUB_REF}" > "$EVIDENCE_DIR/meta.txt"
          echo "sha=${GITHUB_SHA}" >> "$EVIDENCE_DIR/meta.txt"

      - name: Verify required secrets present (prod)
        run: |
          set -euo pipefail
          missing=()
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF DB_PASSWORD DATABASE_URL CRON_SECRET BASE_URL SYSTEM_MOTOR_SECRET; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required prod secrets/env: ${missing[*]}"
            exit 1
          fi
          echo "All required prod secrets present."

      # ✅ Gate 1: same gate in prod (fail before touching prod)
      - name: Migration gate (order + bootstrap-safe)
        run: |
          set -euo pipefail
          node scripts/ci/migration-gate.mjs | tee "$EVIDENCE_DIR/migration-gate.log"

      - name: Link project (prod)
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Apply migrations (prod)
        run: |
          set -euo pipefail
          supabase db push --linked --password "$DB_PASSWORD" --yes \
            2>&1 | tee "$EVIDENCE_DIR/db-push.log"

      - name: Verify migration actually applied (prod)
        run: |
          set -euo pipefail
          LATEST_LOCAL="$(ls supabase/migrations/ | sort | tail -1 | grep -oP '^\d+' || true)"
          if [ -z "$LATEST_LOCAL" ]; then
            echo "No local migrations found — skipping verify."
            exit 0
          fi
          echo "Verifying $LATEST_LOCAL is in schema_migrations (prod)..."
          APPLIED="$(psql "$DATABASE_URL" -t -A -c \
            "SELECT version FROM supabase_migrations.schema_migrations \
             WHERE version = '$LATEST_LOCAL'")"
          if [ "$APPLIED" != "$LATEST_LOCAL" ]; then
            echo "::error::Migration $LATEST_LOCAL not in prod schema_migrations!"
            echo "Last 5 applied versions:"
            psql "$DATABASE_URL" -c \
              "SELECT version FROM supabase_migrations.schema_migrations \
               ORDER BY version DESC LIMIT 5"
            exit 1
          fi
          echo "Migration $LATEST_LOCAL verified applied on prod."

      - name: Verify DB contracts (prod)
        run: |
          set -euo pipefail
          node scripts/ci/db-contracts.mjs 2>&1 | tee "$EVIDENCE_DIR/db-contracts.log"

      - name: Smoke tests (prod)
        run: |
          set -euo pipefail
          bash scripts/smoke/cron-smoke.sh 2>&1 | tee "$EVIDENCE_DIR/cron-smoke.log"

      - name: Typegen (prod)
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/typegen"
          supabase gen types typescript --project-id "$PROJECT_REF" --schema public > "$EVIDENCE_DIR/typegen/supabase.types.ts"
          echo "typegen=ok" >> "$EVIDENCE_DIR/meta.txt"

      - name: Upload evidence artifact (prod)
        uses: actions/upload-artifact@v6
        with:
          name: evidence-prod-${{ github.sha }}
          path: evidence/prod
          if-no-files-found: error
