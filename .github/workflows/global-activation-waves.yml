# Activation waves 1–4 with ≥15m observation. Fail-closed for missing legal/tax.
name: global-activation-waves

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Frozen GLOBAL_RELEASE_SHA (40-char)"
        required: true
        type: string
      observe_minutes:
        description: "Per-wave observation minutes (min 15)"
        required: false
        default: "15"
        type: string
      reason:
        description: "Dispatch reason"
        required: false
        default: "activation-waves-fail-closed"

concurrency:
  group: global-activation-waves
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  PROD_REF: hkpokyapzarefrgqzkos

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: load-cert
    steps:
      - name: Validate inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OBSERVE_MINUTES: ${{ inputs.observe_minutes }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid release_sha"
            exit 1
          fi
          if [[ ! "$OBSERVE_MINUTES" =~ ^[0-9]+$ ]] || [ "$OBSERVE_MINUTES" -lt 15 ]; then
            echo "::error::observe_minutes must be >= 15"
            exit 1
          fi
          echo "GLOBAL_RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "WAVE_OBSERVE_MINUTES=$OBSERVE_MINUTES" >> "$GITHUB_ENV"

      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Build exact country legal/tax matrix
        env:
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: node scripts/autonomous-release/global-country-legal-tax-matrix.mjs

      - name: Run activation waves (ready countries only)
        env:
          GLOBAL_RELEASE_SHA: ${{ env.GLOBAL_RELEASE_SHA }}
          WAVE_OBSERVE_MINUTES: ${{ env.WAVE_OBSERVE_MINUTES }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PROD_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: node scripts/autonomous-release/global-activation-waves.mjs

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-activation-waves-${{ github.run_id }}
          path: |
            docs/rc/launch-2026-08-01/COUNTRY-LEGAL-TAX-READINESS-MATRIX.json
            docs/rc/launch-2026-08-01/GLOBAL-ACTIVATION-WAVES.json
          if-no-files-found: warn
