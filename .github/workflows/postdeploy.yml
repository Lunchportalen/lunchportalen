name: postdeploy-gate

env:
  ONNXRUNTIME_NODE_INSTALL: skip

on:
  # Run only after Umbraco Azure deploy completes (www.lunchportalen.no target).
  # Decoupled from CI (AGENTS gate) to avoid racing Azure stop/start + warm-up.
  workflow_run:
    workflows: ["Umbraco CMS — Azure Web App deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postdeploy:
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout (workflow_run commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Load POSTDEPLOY_BASE_URL
        shell: bash
        env:
          POSTDEPLOY_BASE_URL: ${{ secrets.POSTDEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${POSTDEPLOY_BASE_URL:-}" ]]; then
            echo "::error::Missing secret POSTDEPLOY_BASE_URL (GitHub Actions → Secrets)."
            exit 1
          fi
          echo "POSTDEPLOY_BASE_URL=${POSTDEPLOY_BASE_URL}" >> "$GITHUB_ENV"

      - name: Run postdeploy gate
        shell: bash
        env:
          POSTDEPLOY_TIMEOUT_MS: "15000"
          POSTDEPLOY_RETRIES: "12"
          POSTDEPLOY_RETRY_DELAY_MS: "15000"
          POSTDEPLOY_JSON_CHECKS: "0"
        run: npm run postdeploy
