# Umbraco CMS — Azure App Service (lunchportalen-umbraco)
# Builds and deploys only ./umbraco17/lunchportalen/lunchportalen.csproj
# Does NOT build or deploy Next.js / Vercel app.

name: Umbraco CMS — Azure Web App deploy

on:
  push:
    branches:
      - main
    paths:
      - "umbraco17/lunchportalen/**"
      - ".github/workflows/main_lunchportalen-umbraco.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  UMBRACO_CSPROJ: ./umbraco17/lunchportalen/lunchportalen.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/umbraco-app
  AZURE_WEBAPP_NAME: lunchportalen-umbraco
  AZURE_RESOURCE_GROUP: rg-lunchportalen-prod
  DEPLOY_STAMP_PATH: App_Data/deploy-stamp.json
  PROD_HOME_URL: https://www.lunchportalen.no/

jobs:
  build:
    name: Build Umbraco CMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "${{ env.UMBRACO_CSPROJ }}"

      - name: Publish Umbraco CMS
        run: >
          dotnet publish "${{ env.UMBRACO_CSPROJ }}" --configuration Release
          --no-restore --output "${{ env.PUBLISH_DIR }}"

      - name: Verify publish output
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Git commit deployed by this build"
          git log -1 --oneline
          git rev-parse HEAD
          echo "::endgroup::"

          PUBLISH_DIR="${{ env.PUBLISH_DIR }}"

          if [[ ! -d "$PUBLISH_DIR" ]]; then
            echo "::error::Publish directory is missing: $PUBLISH_DIR"
            exit 1
          fi

          echo "::group::Publish folder sample"
          ls -la "$PUBLISH_DIR" | head -n 120 || true
          echo "::endgroup::"

          APP_DLL="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -iname "lunchportalen.dll" | head -n 1 || true)"
          if [[ -z "$APP_DLL" ]]; then
            echo "::error::Missing lunchportalen.dll / Lunchportalen.dll in publish output."
            exit 1
          fi
          echo "Found app dll: $APP_DLL"

          DEPS_FILE="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -iname "*.deps.json" | head -n 1 || true)"
          if [[ -z "$DEPS_FILE" ]]; then
            echo "::error::No .deps.json file found in publish output."
            exit 1
          fi
          echo "Found deps file: $DEPS_FILE"

          if find "$PUBLISH_DIR" -maxdepth 1 -type f -iname "Umbraco.Cms.DevelopmentMode.Backoffice.dll" | grep -q .; then
            echo "::error::Umbraco.Cms.DevelopmentMode.Backoffice.dll must not be in Release publish output."
            exit 1
          fi

          if grep -qF -- "DevelopmentMode.Backoffice" "$DEPS_FILE"; then
            echo "::error::.deps.json must not reference DevelopmentMode.Backoffice in Release."
            grep -n "DevelopmentMode" "$DEPS_FILE" | head -20 || true
            exit 1
          fi

          echo "OK: Umbraco Release publish artifact is valid."

      - name: Write deploy-stamp.json
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="${{ env.PUBLISH_DIR }}"
          STAMP_FILE="${PUBLISH_DIR}/${{ env.DEPLOY_STAMP_PATH }}"
          APP_DLL="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -iname "lunchportalen.dll" | head -n 1)"
          DLL_SIZE="$(stat -c%s "$APP_DLL")"

          mkdir -p "$(dirname "$STAMP_FILE")"
          printf '{"sha":"%s","dllSize":%s}\n' "${GITHUB_SHA}" "${DLL_SIZE}" > "$STAMP_FILE"

          if [[ ! -f "$STAMP_FILE" ]]; then
            echo "::error::deploy-stamp.json was not written to artifact path"
            exit 1
          fi

          echo "deploy-stamp.json written:"
          cat "$STAMP_FILE"

      - name: Upload umbraco-app artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbraco-app
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy Umbraco CMS to Azure
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download umbraco-app artifact
        uses: actions/download-artifact@v4
        with:
          name: umbraco-app
          path: ${{ github.workspace }}/umbraco-app

      - name: Deploy context
        shell: bash
        run: |
          set -euo pipefail

          echo "Triggering commit SHA: ${GITHUB_SHA}"
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Deploying to Azure Web App: ${{ env.AZURE_WEBAPP_NAME }} (${{ env.AZURE_RESOURCE_GROUP }})"

          echo "::group::Downloaded artifact sample"
          ls -la "${{ github.workspace }}/umbraco-app" | head -n 120 || true
          echo "::endgroup::"

          STAMP="${{ github.workspace }}/umbraco-app/${{ env.DEPLOY_STAMP_PATH }}"
          if [[ ! -f "$STAMP" ]]; then
            echo "::error::Artifact missing ${{ env.DEPLOY_STAMP_PATH }}"
            exit 1
          fi
          echo "Artifact deploy-stamp.json:"
          cat "$STAMP"

      - name: V.25 + V.26 — Deploy-payload integrity
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${{ github.workspace }}/umbraco-app"

          # V.25 — wwwroot/media/ skal IKKE være i artifact
          if find "$ARTIFACT/wwwroot/media" -type f 2>/dev/null | grep -q .; then
            echo "::error::V.25 FAIL — wwwroot/media/ inneholder filer i deploy-artifact"
            exit 1
          fi
          echo "V.25 OK — wwwroot/media/ ikke i artifact"

          # V.26 — appsettings.Development.json skal IKKE være i artifact
          if [ -f "$ARTIFACT/appsettings.Development.json" ]; then
            echo "::error::V.26 FAIL — appsettings.Development.json er i deploy-artifact"
            exit 1
          fi
          echo "V.26 OK — Development.json ikke i artifact"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package app.zip for deploy
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${{ github.workspace }}/umbraco-app"
          ZIP_PATH="${{ github.workspace }}/app.zip"

          rm -f "$ZIP_PATH"
          (cd "$APP_DIR" && zip -r "$ZIP_PATH" .)

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::app.zip was not created"
            exit 1
          fi

          ls -lh "$ZIP_PATH"

      - name: Stop App Service before deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "Stopping ${{ env.AZURE_WEBAPP_NAME }} for clean zip deploy..."
          az webapp stop \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: Deploy zip with clean true
        id: deploy_zip
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src-path "${{ github.workspace }}/app.zip" \
            --type zip \
            --clean true

      - name: Start App Service after deploy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting ${{ env.AZURE_WEBAPP_NAME }} (if: always — rollback-safe)..."
          az webapp start \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: V.27a — Post-deploy disk stamp (Kudu VFS)
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_STAMP="${{ github.workspace }}/umbraco-app/${{ env.DEPLOY_STAMP_PATH }}"
          EXPECTED_SHA="$(jq -r '.sha' "$ARTIFACT_STAMP")"

          TOKEN="$(az account get-access-token --resource "https://appservice.azure.com" --query accessToken -o tsv)"
          SCM_HOST="$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "enabledHostNames[?contains(@, '.scm.')] | [0]" -o tsv)"

          if [[ -z "$SCM_HOST" ]]; then
            echo "::error::V.27a FAIL — could not resolve SCM host"
            exit 1
          fi

          STAMP_URL="https://${SCM_HOST}/api/vfs/site/wwwroot/${{ env.DEPLOY_STAMP_PATH }}"
          HTTP_CODE="$(curl -sS -o /tmp/disk-deploy-stamp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "$STAMP_URL")"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::V.27a FAIL — deploy-stamp.json missing on prod disk (HTTP ${HTTP_CODE})"
            exit 1
          fi

          DISK_SHA="$(jq -r '.sha' /tmp/disk-deploy-stamp.json)"

          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Disk SHA:     ${DISK_SHA}"

          if [[ "$DISK_SHA" != "$EXPECTED_SHA" ]] || [[ "$DISK_SHA" != "${GITHUB_SHA}" ]]; then
            echo "::error::V.27a FAIL — deploy-stamp sha mismatch (OneDeploy no-op or stale disk)"
            exit 1
          fi

          echo "V.27a OK — prod disk deploy-stamp sha matches GITHUB_SHA"

      - name: V.27b — Poll prod homepage (cold start)
        shell: bash
        run: |
          set -euo pipefail

          URL="${{ env.PROD_HOME_URL }}"
          TIMEOUT_SEC=300
          INTERVAL_SEC=10
          ELAPSED=0

          echo "Polling ${URL} for HTTP 200 (timeout ${TIMEOUT_SEC}s)..."

          while [[ "$ELAPSED" -lt "$TIMEOUT_SEC" ]]; do
            HTTP_CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || true)"
            echo "  t=${ELAPSED}s → HTTP ${HTTP_CODE}"

            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "V.27b OK — ${URL} returned 200"
              exit 0
            fi

            sleep "$INTERVAL_SEC"
            ELAPSED=$((ELAPSED + INTERVAL_SEC))
          done

          echo "::error::V.27b FAIL — ${URL} did not return 200 within ${TIMEOUT_SEC}s"
          exit 1
