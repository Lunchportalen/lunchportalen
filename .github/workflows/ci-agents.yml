name: CI (AGENTS gate)

on:
  pull_request:
    paths: &nextjs_ci_paths
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "studio/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "e2e/**"
      - "middleware.ts"
      - "next.config.ts"
      - "instrumentation.ts"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - ".eslintrc.cjs"
      - "eslint.config.*"
      - "AGENTS.md"
      - ".github/workflows/ci-agents.yml"
  push:
    branches: [main]
    paths: *nextjs_ci_paths

jobs:
  agents_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Guard required env (Sanity)
        shell: bash
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          set -euo pipefail
          if [[ -z "${NEXT_PUBLIC_SANITY_PROJECT_ID:-}" ]]; then
            echo "::error::Missing NEXT_PUBLIC_SANITY_PROJECT_ID (GitHub Actions secret)."
            exit 1
          fi
          if [[ -z "${NEXT_PUBLIC_SANITY_DATASET:-}" ]]; then
            echo "::error::Missing NEXT_PUBLIC_SANITY_DATASET (GitHub Actions secret)."
            exit 1
          fi

      - name: AGENTS gate
        run: npm run agents:check
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm run test:run

      - name: Tenant isolation test
        env:
          NODE_ENV: test
        run: npm run test:tenant

      # Production build + audit — audit may exit non-zero (unknown routes); log only; do not fail agents gate.
      - name: Build enterprise
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SANITY_PROJECT_ID
          export NEXT_PUBLIC_SANITY_DATASET
          npm run build:enterprise || echo "::warning::build:enterprise exited non-zero (audit output above; non-blocking for agents gate)"
