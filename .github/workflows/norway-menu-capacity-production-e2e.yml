# Norway menu + capacity production E2E — controlled internal operational proof.
# workflow_dispatch only. Production environment protection. Max one active run.
name: norway-menu-capacity-production-e2e

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Dispatch reason"
        required: false
        default: "norway-menu-capacity-production-e2e"
      resume_from_checkpoint:
        description: "Optional checkpoint id (preflight|warmdish|concurrency|orders|kitchen|auth|cleanup)"
        required: false
        default: "preflight"

concurrency:
  group: norway-menu-capacity-production-e2e
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    outputs:
      run_id: ${{ steps.meta.outputs.run_id }}
      production_sha: ${{ steps.meta.outputs.production_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Build acceptance run id
        id: meta
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${PROD_BASE_URL:-https://app.lunchportalen.no}"
          BODY=$(curl -fsS "$BASE/api/health")
          SHA=$(node -e "const j=JSON.parse(process.argv[1]); process.stdout.write(String(j?.data?.version||''))" "$BODY")
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::production SHA missing/invalid"
            exit 1
          fi
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          RUN_ID="norway-menu-capacity-e2e-${TS}-${SHA:0:8}"
          echo "production_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "NORWAY_MENU_CAPACITY_ACCEPTANCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID"

      - name: Preflight + full menu/capacity E2E
        env:
          NORWAY_MENU_CAPACITY_ACCEPTANCE_RUN_ID: ${{ steps.meta.outputs.run_id }}
          GLOBAL_RELEASE_SHA: ${{ steps.meta.outputs.production_sha }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://hkpokyapzarefrgqzkos.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          K6_PROD_PASSWORD: ${{ secrets.K6_PROD_PASSWORD }}
          K6_PROD_SUPABASE_URL: https://hkpokyapzarefrgqzkos.supabase.co
          # Canonical Norway production Sanity project (do not use a wrong GH secret project id).
          NEXT_PUBLIC_SANITY_PROJECT_ID: "4udoq5d8"
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2021-10-21"
          SANITY_API_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${NODE_TLS_REJECT_UNAUTHORIZED:-}" == "0" ]]; then
            echo "::error::INSECURE_TLS_BYPASS — NODE_TLS_REJECT_UNAUTHORIZED=0 is forbidden"
            exit 1
          fi
          if [[ "${NEXT_PUBLIC_SANITY_PROJECT_ID}" != "4udoq5d8" ]]; then
            echo "::error::SANITY_WRONG_PROJECT — expected 4udoq5d8"
            exit 1
          fi
          # Token is optional for published reads; wrong-scoped tokens are ignored by harness fallback.
          node scripts/autonomous-release/norway-menu-capacity-production-e2e.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norway-menu-capacity-production-e2e-${{ steps.meta.outputs.run_id || github.run_id }}
          path: |
            docs/rc/launch-2026-08-01/NORWAY-MENU-CAPACITY-PRODUCTION-E2E.md
            docs/rc/launch-2026-08-01/evidence/
          if-no-files-found: warn

  cleanup:
    needs: [preflight]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize
        run: |
          set -euo pipefail
          echo "workflow_run_id=${{ github.run_id }}"
          echo "acceptance_run_id=${{ needs.preflight.outputs.run_id }}"
          echo "production_sha=${{ needs.preflight.outputs.production_sha }}"
          echo "preflight_result=${{ needs.preflight.result }}"
